<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Christmas Crossword</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);
      padding: 20px;
      color: #263238;
    }
    h1 {
      text-align: center;
      color: #d50000;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 40px);
      grid-template-rows: repeat(6, 40px);
      gap: 1px;
      background-color: #000;
      padding: 3px;
      border: 2px solid #333;
      margin-bottom: 20px;
    }
    .cell {
      width: 40px;
      height: 40px;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      font-weight: bold;
      font-size: 18px;
      box-sizing: border-box;
    }
    .cell.black {
      background: #263238;
    }
    .cell span.number {
      position: absolute;
      top: 2px;
      left: 2px;
      font-size: 10px;
      color: #000;
      font-weight: bold;
    }
    .clues {
      max-width: 300px;
    }
    .clues h2 {
      color: #d50000;
      border-bottom: 2px solid #d50000;
      padding-bottom: 5px;
    }
    .clue {
      margin: 8px 0;
      line-height: 1.4;
    }
    .horizontal, .vertical {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <h1>🎄 Christmas Crossword</h1>
  <div class="container">
    <div class="grid" id="crossword"></div>
    <div class="clues">
      <h2>Clues</h2>
      <div class="horizontal">
        <strong>Across:</strong>
        <div class="clue">1. White flakes that fall in winter</div>
        <div class="clue">3. Present under the tree</div>
        <div class="clue">4. French Christmas word (rhymes with "ball")</div>
      </div>
      <div class="vertical">
        <strong>Down:</strong>
        <div class="clue">2. Decorated pine in the living room</div>
        <div class="clue">5. They jingle all the way</div>
      </div>
    </div>
  </div>

  <script>
    // Initialize 6x6 grid with null (empty)
    const size = 6;
    let grid = Array(size).fill().map(() => Array(size).fill(null));

    // Mark black cells (■)
    const blackCells = [
      [0,0], [0,1], [0,5],
      [1,0], [1,5],
      [2,0], [2,3], [2,4], [2,5],
      [3,0], [3,1], [3,5],
      [4,0], [4,5],
      [5,0], [5,1], [5,5]
    ];

    blackCells.forEach(([r, c]) => {
      grid[r][c] = '■';
    });

    // Define words with start position, direction, and number
    const words = [
      { word: "SNOW",  start: [0, 2], dir: "h", num: 1 },   // Across
      { word: "TREE",  start: [0, 3], dir: "v", num: 2 },   // Down
      { word: "GIFT",  start: [2, 1], dir: "h", num: 3 },   // Across
      { word: "NOEL",  start: [4, 1], dir: "h", num: 4 },   // Across
      { word: "BELLS", start: [1, 4], dir: "v", num: 5 }    // Down
    ];

    // Fill the grid with letters and numbers
    words.forEach(w => {
      const [r, c] = w.start;
      if (w.dir === "h") {
        for (let i = 0; i < w.word.length; i++) {
          const letter = w.word[i];
          if (i === 0) {
            grid[r][c + i] = { letter, number: w.num };
          } else {
            grid[r][c + i] = letter;
          }
        }
      } else if (w.dir === "v") {
        for (let i = 0; i < w.word.length; i++) {
          const letter = w.word[i];
          if (i === 0) {
            grid[r + i][c] = { letter, number: w.num };
          } else {
            grid[r + i][c] = letter;
          }
        }
      }
    });

    // Render grid in HTML
    const container = document.getElementById("crossword");
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        const val = grid[r][c];

        if (val === '■') {
          cell.classList.add("black");
        } else if (val !== null) {
          if (typeof val === "object") {
            cell.textContent = val.letter;
            const numSpan = document.createElement("span");
            numSpan.className = "number";
            numSpan.textContent = val.number;
            cell.appendChild(numSpan);
          } else {
            cell.textContent = val;
          }
        }
        container.appendChild(cell);
      }
    }
  </script>
</body>
</html>
